<!DOCTYPE html>
<html lang="en">

<head>
    <title> My Study Progress dashbord</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width-device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{
            background-color: #FDFBF7;
            font-family: Arial, Helvetica, sans-serif;
        }
        .jumbotron{
            background-color: #F3EFEA;
            border-left: 6px solid #C85A32;

        }
        .jumbotron h1{
            color: darkcyan;
        }
        .section-title{
            color: darkcyan;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        p{
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My Study Progress Dashboard</h1>
            <p class="lead">Track your subjects, completed lessons, and learning progress in one place.</p>
            <button class="btn btn-primary">Math</button>
            <button class="btn btn-success"> English</button>
            <button class="btn btn-warning"> Science</button>
            <button class="btn btn-danger"> Coding</button>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Lessons Completed<span class="badge badge-primary">24</span></h2>
        <p> Math <span class="badge badge-primary">8 lessons</span></p>
        <p> English <span class="badge badge-success">6 lessons</span></p>
        <p> Science <span class="badge badge-warning">5 lessons</span></p>
        <p> Coding <span class="badge badge-danger">5 lessons</span></p>
        <h2 class="section-title">Subject Progress</h2>
        <p> Math</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width: 80%;">80%</div>
        </div>
        <p> English</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width: 55%;">55%</div>
        </div>

        <p> Science</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 65%;">65%</div>
        </div>

        <p> Coding</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger" style="width: 70%;">70%</div>
        </div>
    </div>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>
</body>
</html>
